<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Daily Task Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0f1a;
      --surface: #131929;
      --surface2: #1b2337;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --text: #f0f2f8;
      --muted: #8490aa;
      --accent: #6c8fff;
      --accent2: #a78bfa;
      --accent3: #34d399;
      --accent4: #f87171;
      --accent5: #fbbf24;
      --accent6: #38bdf8;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 5rem;
    }

    /* Background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(108,143,255,0.12), transparent 70%);
      top: -100px; right: -100px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(167,139,250,0.10), transparent 70%);
      bottom: -80px; left: -80px;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 700px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 100px;
      padding: 6px 16px 6px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .logo-badge span.dot {
      width: 8px; height: 8px;
      background: var(--accent3);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px var(--accent3);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f0f2f8 30%, #8490aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.8rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 300;
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      justify-content: center;
    }
    .filter-btn {
      padding: 6px 16px;
      border-radius: 100px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
    }
    .count-label {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }
    .count-input {
      width: 70px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .count-input:focus { border-color: var(--accent); }
    .spacer { flex: 1; }
    .generate-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(108,143,255,0.3);
    }
    .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(108,143,255,0.45); }
    .generate-btn:active { transform: translateY(0); }
    .generate-btn .icon { font-size: 18px; transition: transform 0.3s; }
    .generate-btn:hover .icon { transform: rotate(180deg); }

    /* Task list */
    #taskList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: slideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      position: relative;
      overflow: hidden;
    }
    .task-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
      background: var(--tag-color, var(--accent));
      opacity: 0.8;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .task-item:hover { background: var(--surface2); border-color: var(--border2); transform: translateX(4px); }
    .task-item.done {
      opacity: 0.45;
    }
    .task-item.done .task-text { text-decoration: line-through; }

    .task-icon-wrap {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .task-content { flex: 1; min-width: 0; }
    .task-text {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }
    .task-meta {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .task-tag {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 9px;
      border-radius: 100px;
      background: var(--tag-bg, rgba(108,143,255,0.15));
      color: var(--tag-color, var(--accent));
      letter-spacing: 0.03em;
    }
    .task-time {
      font-size: 11px;
      color: var(--muted);
    }
    .task-priority {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .prio-high { background: rgba(248,113,113,0.15); color: var(--accent4); }
    .prio-med { background: rgba(251,191,36,0.12); color: var(--accent5); }
    .prio-low { background: rgba(52,211,153,0.12); color: var(--accent3); }

    .task-check {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      transition: all 0.2s;
    }
    .task-item.done .task-check {
      background: var(--accent3);
      border-color: var(--accent3);
      color: #fff;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: center;
    }
    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label { font-size: 12px; color: var(--muted); }

    /* Progress */
    .progress-wrap {
      margin-bottom: 2rem;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 5px;
      background: var(--surface2);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      width: 0%;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
    .empty-state p { font-size: 1rem; }

    /* Shuffle animation */
    .shuffling .task-item {
      animation: shuffle 0.4s ease both;
    }
    @keyframes shuffle {
      0% { opacity: 1; transform: scale(1); }
      40% { opacity: 0; transform: scale(0.9) translateY(-6px); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo-badge"><span class="dot"></span> Daily Planner</div>
    <h1>TaskFlow</h1>
    <p class="subtitle">Curate your day with purpose-driven tasks</p>
  </header>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar" style="display:none;">
    <div class="stat-card">
      <div class="stat-num" id="statTotal" style="color:var(--accent)">0</div>
      <div class="stat-label">Generated</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statDone" style="color:var(--accent3)">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statLeft" style="color:var(--accent5)">0</div>
      <div class="stat-label">Remaining</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap" style="display:none;">
    <div class="progress-header">
      <span>Progress</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- Category filters -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="Learning">📚 Learning</button>
    <button class="filter-btn" data-cat="Health">💪 Health</button>
    <button class="filter-btn" data-cat="Productivity">⚡ Productivity</button>
    <button class="filter-btn" data-cat="Creative">🎨 Creative</button>
    <button class="filter-btn" data-cat="Social">🤝 Social</button>
    <button class="filter-btn" data-cat="Mindfulness">🧘 Mindfulness</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <span class="count-label">Tasks to generate:</span>
    <input type="number" class="count-input" id="countInput" value="5" min="1" max="10">
    <div class="spacer"></div>
    <button class="generate-btn" id="generateBtn">
      <span class="icon">⟳</span> Generate
    </button>
  </div>

  <!-- Task list -->
  <ul id="taskList">
    <li class="empty-state">
      <div class="empty-icon">✦</div>
      <p>Hit Generate to build your task list</p>
    </li>
  </ul>
</div>

<script>
  const taskData = [
    // Learning
    { text: "Study a new JavaScript concept for 30 min", cat: "Learning", icon: "📖", time: "30 min", priority: "high" },
    { text: "Read 20 pages of a non-fiction book", cat: "Learning", icon: "📚", time: "25 min", priority: "med" },
    { text: "Watch a programming tutorial", cat: "Learning", icon: "🎓", time: "45 min", priority: "med" },
    { text: "Practice typing speed exercises", cat: "Learning", icon: "⌨️", time: "15 min", priority: "low" },
    { text: "Learn 10 new vocabulary words", cat: "Learning", icon: "🔤", time: "20 min", priority: "low" },
    { text: "Complete an online course module", cat: "Learning", icon: "🏫", time: "60 min", priority: "high" },
    { text: "Solve 3 coding challenges on LeetCode", cat: "Learning", icon: "💻", time: "45 min", priority: "high" },
    { text: "Review your notes from last week", cat: "Learning", icon: "📝", time: "20 min", priority: "med" },
    { text: "Listen to an educational podcast episode", cat: "Learning", icon: "🎧", time: "30 min", priority: "low" },
    { text: "Study a new design pattern or architecture", cat: "Learning", icon: "🧩", time: "40 min", priority: "high" },

    // Health
    { text: "Go for a 30-minute walk outside", cat: "Health", icon: "🚶", time: "30 min", priority: "high" },
    { text: "Do a 20-minute yoga session", cat: "Health", icon: "🧘", time: "20 min", priority: "med" },
    { text: "Drink 8 glasses of water today", cat: "Health", icon: "💧", time: "All day", priority: "high" },
    { text: "Prepare a healthy meal from scratch", cat: "Health", icon: "🥗", time: "40 min", priority: "med" },
    { text: "Do a 15-minute stretching routine", cat: "Health", icon: "🤸", time: "15 min", priority: "low" },
    { text: "Complete a 30-minute workout", cat: "Health", icon: "🏋️", time: "30 min", priority: "high" },
    { text: "Get to bed before 11 PM tonight", cat: "Health", icon: "😴", time: "Evening", priority: "high" },
    { text: "Take a screen break every 50 minutes", cat: "Health", icon: "👁️", time: "Recurring", priority: "med" },
    { text: "Track your meals and calories today", cat: "Health", icon: "🍎", time: "All day", priority: "med" },
    { text: "Do 10 minutes of deep breathing", cat: "Health", icon: "🫁", time: "10 min", priority: "low" },

    // Productivity
    { text: "Do a full inbox zero session", cat: "Productivity", icon: "📬", time: "30 min", priority: "high" },
    { text: "Plan tomorrow's schedule tonight", cat: "Productivity", icon: "📅", time: "15 min", priority: "high" },
    { text: "Complete your most-dreaded task first", cat: "Productivity", icon: "🎯", time: "Varies", priority: "high" },
    { text: "Clean and organize your workspace", cat: "Productivity", icon: "🗂️", time: "20 min", priority: "med" },
    { text: "Review and update your to-do list", cat: "Productivity", icon: "✅", time: "10 min", priority: "med" },
    { text: "Set 3 clear goals for this week", cat: "Productivity", icon: "🏹", time: "15 min", priority: "high" },
    { text: "Do a 25-minute deep focus Pomodoro", cat: "Productivity", icon: "⏱️", time: "25 min", priority: "med" },
    { text: "Delete or archive old files/folders", cat: "Productivity", icon: "🗑️", time: "20 min", priority: "low" },
    { text: "Automate one repetitive task you do", cat: "Productivity", icon: "🤖", time: "60 min", priority: "high" },
    { text: "Do a weekly review of your progress", cat: "Productivity", icon: "📊", time: "30 min", priority: "high" },

    // Creative
    { text: "Write 300 words of a personal project", cat: "Creative", icon: "✍️", time: "25 min", priority: "med" },
    { text: "Sketch or doodle for 15 minutes", cat: "Creative", icon: "🎨", time: "15 min", priority: "low" },
    { text: "Build a mini project from scratch", cat: "Creative", icon: "🏗️", time: "90 min", priority: "high" },
    { text: "Take 10 interesting photos outdoors", cat: "Creative", icon: "📸", time: "20 min", priority: "low" },
    { text: "Write a short story or poem", cat: "Creative", icon: "📜", time: "30 min", priority: "med" },
    { text: "Design something in Figma or Canva", cat: "Creative", icon: "🖌️", time: "45 min", priority: "med" },
    { text: "Brainstorm 10 ideas for a side project", cat: "Creative", icon: "💡", time: "20 min", priority: "med" },
    { text: "Edit or publish a piece of your work", cat: "Creative", icon: "🚀", time: "30 min", priority: "high" },
    { text: "Create a moodboard for inspiration", cat: "Creative", icon: "🎭", time: "25 min", priority: "low" },
    { text: "Record a short video or voice memo", cat: "Creative", icon: "🎬", time: "15 min", priority: "low" },

    // Social
    { text: "Reach out to a friend you haven't spoken to in a while", cat: "Social", icon: "👋", time: "15 min", priority: "med" },
    { text: "Write a thoughtful message to someone you appreciate", cat: "Social", icon: "💌", time: "10 min", priority: "med" },
    { text: "Schedule a catch-up call or coffee date", cat: "Social", icon: "☕", time: "10 min", priority: "high" },
    { text: "Engage genuinely in an online community", cat: "Social", icon: "🌐", time: "20 min", priority: "low" },
    { text: "Give someone a specific compliment today", cat: "Social", icon: "🌟", time: "5 min", priority: "low" },
    { text: "Help a colleague or peer with something", cat: "Social", icon: "🤝", time: "Varies", priority: "med" },
    { text: "Share something interesting you've learned", cat: "Social", icon: "📢", time: "10 min", priority: "low" },

    // Mindfulness
    { text: "Meditate for 10 minutes in silence", cat: "Mindfulness", icon: "🧘", time: "10 min", priority: "high" },
    { text: "Write 3 things you're grateful for", cat: "Mindfulness", icon: "🙏", time: "5 min", priority: "high" },
    { text: "Do a 5-minute body scan relaxation", cat: "Mindfulness", icon: "🌊", time: "5 min", priority: "low" },
    { text: "Spend 20 minutes completely offline", cat: "Mindfulness", icon: "🔇", time: "20 min", priority: "med" },
    { text: "Practice mindful eating at one meal", cat: "Mindfulness", icon: "🍽️", time: "20 min", priority: "low" },
    { text: "Journal your thoughts for 10 minutes", cat: "Mindfulness", icon: "📓", time: "10 min", priority: "med" },
    { text: "Watch a sunrise or sunset today", cat: "Mindfulness", icon: "🌅", time: "15 min", priority: "low" },
  ];

  const catColors = {
    "Learning":     { color: "#6c8fff", bg: "rgba(108,143,255,0.12)" },
    "Health":       { color: "#34d399", bg: "rgba(52,211,153,0.12)" },
    "Productivity": { color: "#fbbf24", bg: "rgba(251,191,36,0.12)" },
    "Creative":     { color: "#a78bfa", bg: "rgba(167,139,250,0.12)" },
    "Social":       { color: "#38bdf8", bg: "rgba(56,189,248,0.12)" },
    "Mindfulness":  { color: "#f87171", bg: "rgba(248,113,113,0.12)" },
  };

  let currentTasks = [];
  let activeFilter = "all";
  let doneSet = new Set();

  const generateBtn = document.getElementById("generateBtn");
  const taskList = document.getElementById("taskList");
  const countInput = document.getElementById("countInput");
  const statsBar = document.getElementById("statsBar");
  const progressWrap = document.getElementById("progressWrap");
  const progressFill = document.getElementById("progressFill");
  const progressPct = document.getElementById("progressPct");

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.cat;
      renderTasks();
    });
  });

  generateBtn.addEventListener("click", () => {
    doneSet.clear();
    const count = Math.max(1, Math.min(10, parseInt(countInput.value) || 5));
    const pool = activeFilter === "all" ? taskData : taskData.filter(t => t.cat === activeFilter);
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    currentTasks = shuffled.slice(0, Math.min(count, shuffled.length));

    // Stagger animation
    taskList.classList.add("shuffling");
    setTimeout(() => taskList.classList.remove("shuffling"), 500);

    renderTasks();
    statsBar.style.display = "grid";
    progressWrap.style.display = "block";
    updateStats();
  });

  function renderTasks() {
    if (currentTasks.length === 0) {
      taskList.innerHTML = `<li class="empty-state"><div class="empty-icon">✦</div><p>No tasks match this filter. Try another category.</p></li>`;
      return;
    }
    taskList.innerHTML = "";
    currentTasks.forEach((task, i) => {
      const cc = catColors[task.cat] || { color: "#6c8fff", bg: "rgba(108,143,255,0.12)" };
      const isDone = doneSet.has(i);
      const prioClass = { high: "prio-high", med: "prio-med", low: "prio-low" }[task.priority] || "prio-low";
      const prioLabel = { high: "High", med: "Medium", low: "Low" }[task.priority] || "Low";

      const li = document.createElement("li");
      li.className = "task-item" + (isDone ? " done" : "");
      li.style.setProperty("--tag-color", cc.color);
      li.style.setProperty("--tag-bg", cc.bg);
      li.style.animationDelay = (i * 0.07) + "s";

      li.innerHTML = `
        <div class="task-icon-wrap">${task.icon}</div>
        <div class="task-content">
          <div class="task-text">${task.text}</div>
          <div class="task-meta">
            <span class="task-tag">${task.cat}</span>
            <span class="task-time">⏱ ${task.time}</span>
            <span class="task-priority ${prioClass}">${prioLabel}</span>
          </div>
        </div>
        <div class="task-check">${isDone ? "✓" : ""}</div>
      `;

      li.addEventListener("click", () => {
        if (doneSet.has(i)) doneSet.delete(i);
        else doneSet.add(i);
        renderTasks();
        updateStats();
      });

      taskList.appendChild(li);
    });
  }

  function updateStats() {
    const total = currentTasks.length;
    const done = doneSet.size;
    const left = total - done;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;

    document.getElementById("statTotal").textContent = total;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statLeft").textContent = left;
    progressFill.style.width = pct + "%";
    progressPct.textContent = pct + "%";
  }
</script>
</body>
</html>
